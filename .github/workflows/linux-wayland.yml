name: Linux Wayland lifecycle

on: [push, pull_request]

jobs:
  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux window dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libxcursor-dev libxfixes-dev libvulkan-dev weston
      - name: xkbcommon keymaps and key dispatch through cgo
        run: GIO_XKB_REQUIRED=1 go test ./gio/app/internal/xkb -count=1 -v
      - name: Check invalid-view acknowledgment before native teardown
        run: go test -race ./gio/app -run 'TestDeferredTeardown|TestWaylandEventAcknowledges|TestWaylandRun|TestEventFuncs' -count=1 -timeout=120s
      - name: Check real windows under a headless Wayland compositor
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=keel-test
          export LIBGL_ALWAYS_SOFTWARE=1
          unset DISPLAY
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --renderer=gl --idle-time=0 > /tmp/keel-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" || true; cat /tmp/keel-weston.log; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$compositor" || exit 1
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          KEEL_DESKTOP=1 go test ./ui/window -run TestRealWindows -count=1 -timeout=240s
          go run -race ./ui/window/testdata/configure

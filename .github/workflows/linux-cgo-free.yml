name: Linux without cgo

# Runs the Linux bindings that no longer need cgo, with no C compiler and
# only runtime libraries installed, on Mesa's software renderers. Each step
# grows with the migration in docs/desktop-cgo-free.md (L1, L2).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      CC: /nonexistent-c-compiler
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install runtime libraries only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxfixes3 \
            libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            libvulkan1 mesa-vulkan-drivers \
            xkb-data xvfb xauth weston
      - name: OpenGL ES and EGL through headless rendering (surfaceless)
        env:
          EGL_PLATFORM: surfaceless
        run: GIO_HEADLESS_REQUIRED=1 go test -tags novulkan ./gio/internal/egl ./gio/internal/gl ./gio/gpu/... -count=1 -v -timeout=300s
      - name: xkbcommon keymaps and key dispatch
        run: GIO_XKB_REQUIRED=1 go test ./gio/app/internal/xkb -count=1 -v
      # resident and reopen time out on X11 through cgo as well (closing a
      # window there never completes); they are tracked apart from the
      # migration, and the cgo job runs the same set.
      - name: Real X11 windows under Xvfb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" env KEEL_DESKTOP=1 go test ./ui/window -run 'TestRealWindows/^\./testdata/raise$' -count=1 -timeout=300s -v
      - name: Gio app tests and hello on X11
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" go test ./gio/app -count=1 -timeout=180s
          go build -o /tmp/hello ./examples/hello
          ldd /tmp/hello || true
